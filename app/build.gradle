apply plugin: 'com.android.application'

android {
    namespace 'com.mohamed.voicenotes'
    compileSdkVersion 37

    defaultConfig {
        applicationId "com.mohamed.voicenotes"
        minSdkVersion 21
        targetSdkVersion 34
        versionCode 1
        versionName "1.0"
    }
}

dependencies {
    implementation 'net.java.dev.jna:jna:5.13.0@aar'
    implementation 'com.alphacephei:vosk-android:0.3.47'
}
