name: Build debug APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: ''

      - name: Install Android platform and build tools
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'

      - name: Find project folder
        id: proj
        run: |
          echo "Repo contents:"
          ls -la
          SETTINGS=$(find . -maxdepth 3 \( -name settings.gradle -o -name settings.gradle.kts \) -not -path "*/node_modules/*" | head -n 1)
          if [ -z "$SETTINGS" ]; then
            echo "settings.gradle not found. Upload the project files (app, build.gradle, settings.gradle) to the repo."
            exit 1
          fi
          DIR=$(dirname "$SETTINGS")
          echo "Project dir: $DIR"
          echo "dir=$DIR" >> "$GITHUB_OUTPUT"

      - name: Build debug APK
        working-directory: ${{ steps.proj.outputs.dir }}
        run: |
          if [ -f ./gradlew ]; then
            echo "Using project Gradle wrapper"
            chmod +x ./gradlew
            ./gradlew assembleDebug --stacktrace
          else
            echo "No wrapper, using Gradle 9.6.0"
            gradle assembleDebug --stacktrace
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: VoiceNotes-debug
          path: ${{ steps.proj.outputs.dir }}/app/build/outputs/apk/debug/*.apk
